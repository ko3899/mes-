<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/frontend/static/css/collector.css">
  <title>MES采集终端</title>
</head>
<body>
  <section id="loginView" class="login-view" aria-labelledby="loginTitle">
    <div class="login-frame">
      <div class="login-brand-panel">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">M</span>
          <div><strong>MES 采集终端</strong><span>FACTORY OPERATIONS</span></div>
        </div>
        <div class="brand-message">
          <span class="eyebrow">现场数据 · 即时闭环</span>
          <h1>每一次扫码，<br>都让生产更清晰。</h1>
          <p>连接任务、报工、质量与库存，让一线操作更快、更准、更可靠。</p>
        </div>
        <div class="brand-status"><i></i><span>终端服务已连接</span></div>
      </div>
      <form id="loginForm" class="login-panel" novalidate>
        <div class="login-heading">
          <span class="mobile-brand-mark">M</span>
          <div><span class="eyebrow">WELCOME BACK</span><h2 id="loginTitle">登录采集终端</h2></div>
        </div>
        <p class="login-intro">使用您的工号进入当前班次工作台</p>
        <label class="field"><span>工号 / 用户名</span><input id="usernameInput" name="username" autocomplete="username" placeholder="请输入工号" required></label>
        <label class="field"><span>密码</span><input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
          <div id="captchaField" class="field is-hidden"><span>验证码</span><div style="display:flex;gap:8px"><input id="captchaInput" autocomplete="off" placeholder="请输入图形验证码" style="flex:1;min-width:0"><img id="captchaImage" alt="验证码" title="点击刷新" style="width:120px;height:46px;border:1px solid var(--border);border-radius:9px;background:#f8fafc;cursor:pointer;object-fit:cover"></div></div>
        <p id="loginError" class="form-error" aria-live="polite"></p>
        <button id="loginButton" class="button button-primary button-large" type="submit">进入工作台</button>
        <p class="terminal-note">MES 工厂管家 · 安全采集通道</p>
      </form>
    </div>
  </section>

  <section id="appView" class="collector-shell is-hidden">
    <header class="terminal-header">
      <div class="terminal-brand"><span class="brand-mark small">M</span><div><span>MES COLLECTOR</span><strong id="pageTitle">现场工作台</strong></div></div>
      <div class="header-actions">
        <button id="networkState" class="network-pill" type="button" aria-label="网络与同步状态"><i></i><span>在线</span><b id="syncCount">0</b></button>
        <button id="userButton" class="user-chip" type="button" aria-label="退出登录"><span id="userAvatar">操</span><b id="userName">操作员</b></button>
      </div>
    </header>

    <div id="offlineBanner" class="offline-banner is-hidden" role="status">
      <span>当前处于离线状态，报工将暂存于本机。</span>
      <button id="syncButton" type="button">立即同步</button>
    </div>

    <main id="pageContent" class="page-content" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="采集终端主导航">
      <button class="nav-item is-active" type="button" data-page="home" aria-current="page"><span class="nav-icon">⌂</span><span>首页</span></button>
      <button class="nav-item" type="button" data-page="scan"><span class="nav-icon">⌗</span><span>扫码</span></button>
      <button class="nav-item" type="button" data-page="task"><span class="nav-icon">≡</span><span>任务</span></button>
      <button class="nav-item" type="button" data-page="report"><span class="nav-icon">↗</span><span>报工</span></button>
      <button class="nav-item" type="button" data-page="quality"><span class="nav-icon">✓</span><span>质检</span></button>
      <button class="nav-item" type="button" data-page="material"><span class="nav-icon">▦</span><span>库存</span></button>
    </nav>
  </section>

  <div id="modalRoot" class="modal-root is-hidden"></div>
  <div id="toastRoot" class="toast" role="status" aria-live="polite"></div>

  <script src="/frontend/static/js/core.js"></script>
  <script src="/frontend/static/js/api.js"></script>
  <script src="/frontend/static/js/offline_queue.js"></script>
  <script src="/frontend/static/js/scanner.js"></script>
  <script src="/frontend/static/js/pages.js"></script>
  <script src="/frontend/static/js/app.js"></script>
</body>
</html>
