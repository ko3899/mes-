<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MES工厂管家</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M15 45V19h8l9 14 9-14h8v26h-8V31L32 44 23 31v14z' fill='white'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body>

<!-- Login -->
<section id="loginPage" class="login-layout">
<div class="login-brand" aria-hidden="true">
<div class="brand-lockup"><span class="brand-mark">M</span><span>MES 工厂管家</span></div>
<div class="login-brand-copy">
<p class="eyebrow">SMART MANUFACTURING</p>
<h1>让生产现场<br>清晰、协同、可追溯</h1>
<p>连接计划、生产、质量、仓储与设备，让每一次决策都有实时数据支撑。</p>
</div>
<div class="capability-list"><span>生产协同</span><span>质量闭环</span><span>全程追溯</span></div>
</div>
<div class="login-panel">
<div class="login-box">
<p class="eyebrow">MES CONTROL CENTER</p>
<h2>欢迎回来</h2>
<p class="login-subtitle">登录工厂生产管理平台</p>
<label for="lu">用户名</label>
<input id="lu" type="text" autocomplete="username" placeholder="请输入用户名" value="admin">
<label for="lp">密码</label>
<input id="lp" type="password" autocomplete="current-password" placeholder="请输入密码" value="admin123">
<button id="loginBtn" type="button">登录系统</button>
<div id="lerr" class="login-err" role="status"></div>
</div>
</div>
</section>

<!-- App -->
<div id="appPage" class="app-shell is-hidden">
<aside class="sidebar-shell">
<div class="sidebar-brand"><span class="brand-mark">M</span><span class="sidebar-brand-copy"><strong>MES</strong><small>工厂管家</small></span></div>
<nav id="sideBar" class="sidebar-nav" aria-label="主导航"></nav>
</aside>
<button id="sidebarOverlay" class="sidebar-overlay" type="button" aria-label="关闭侧栏"></button>
<div class="main-shell">
<header class="topbar">
<div class="topbar-leading">
<button class="toggle" id="toggleBtn" type="button" aria-label="切换侧栏" aria-expanded="true">&#9776;</button>
<div class="breadcrumb-block"><span class="eyebrow">MES / OPERATIONS</span><strong id="bread">工作台</strong></div>
</div>
<div class="topbar-actions">
<label class="global-search"><span aria-hidden="true">⌕</span><input type="search" id="globalSearch" placeholder="搜索产品、工单、设备…"></label>
<button class="icon-button notification-button" type="button" aria-label="查看通知" onclick="goPage('notifications')">🔔<span id="notifBadge" class="notification-badge">0</span></button>
<button class="icon-button theme-toggle" id="themeBtn" type="button" onclick="toggleTheme()" aria-label="切换深色主题">🌙</button>
<button class="user" id="logoutBtn" type="button" aria-label="退出登录"><span class="avatar" id="uav">A</span><span id="uname">管理员</span></button>
</div>
</header>
<main class="content" id="pageContent"></main>
<div class="batch-bar" id="batchBar">
<span>已选 <span class="count">0</span> 项</span>
<button class="btn btn-red btn-sm" onclick="batchDelete()">批量删除</button>
<button class="btn btn-blue btn-sm" onclick="compareRecords()">对比</button>
<button class="btn btn-gray btn-sm" onclick="selectedRows.clear();updateBatchBar();crudLoad(1)">取消选择</button>
</div>
<div class="shortcut-hint">
<kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索 · <kbd>Esc</kbd> 关闭 · <kbd>🌙</kbd> 主题
</div>
</div>
</div>

<!-- Modal -->
<div id="modal" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="mTitle">
<div class="modal">
<div class="modal-hd"><h3 id="mTitle">标题</h3><button class="close" id="modalCloseBtn">&times;</button></div>
<div class="modal-bd" id="mBody"></div>
<div class="modal-ft">
<button class="btn btn-gray" id="modalCancelBtn">取消</button>
<button class="btn btn-blue" id="mSave">保存</button>
</div>
</div>
</div>

<!-- JS Modules -->
<script src="/admin/static/js/ui_utils.js"></script>
<script src="/admin/static/js/api.js"></script>
<script src="/admin/static/js/modal.js"></script>
<script src="/admin/static/js/menu.js"></script>
<script src="/admin/static/js/crud.js"></script>
<script src="/admin/static/js/pages/home.js"></script>
<script src="/admin/static/js/pages/business.js"></script>
<script src="/admin/static/js/pages/more.js"></script>
<script src="/admin/static/js/pages/more2.js"></script>
<script src="/admin/static/js/pages/more3.js"></script>
<script src="/admin/static/js/pages/flow_spc.js"></script>
<script src="/admin/static/js/pages/extensions.js"></script>
<script src="/admin/static/js/pages/prod_ext.js"></script>
<script src="/admin/static/js/pages/qm_ext.js"></script>
<script src="/admin/static/js/pages/analytics.js"></script>
<script src="/admin/static/js/pages/sys_ext.js"></script>
<script src="/admin/static/js/pages/final1.js"></script>
<script src="/admin/static/js/pages/final2.js"></script>
<script src="/admin/static/js/pages/final3.js"></script>
<script src="/admin/static/js/pages/query.js"></script>
<script src="/admin/static/js/pages/stage.js"></script>
<script src="/admin/static/js/pages/process_ctrl.js"></script>
<script src="/admin/static/js/pages/warehouse_schedule.js"></script>
<script src="/admin/static/js/notification.js"></script>
<script src="/admin/static/js/app.js"></script>
</body>
</html>
