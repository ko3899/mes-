# MES工厂管家 Nginx 反向代理配置模板
#
# 用途:在 MES 应用前做 TLS 终结、HTTP→HTTPS 跳转、静态资源缓存、限流。
#
# 部署:
#   1. 将本文件放到 /etc/nginx/conf.d/mes.conf(或 sites-available)
#   2. 用 certbot/Let's Encrypt 或自签证书替换 ssl_certificate 路径
#   3. nginx -t && nginx -s reload
#
# 假设 MES 应用监听 127.0.0.1:8080(production.py 默认)。

# 上游 MES 应用(Waitress 单进程多线程)
upstream mes_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 请求体大小限制(与 app.py 的 MAX_CONTENT_LENGTH 对齐)
client_max_body_size 1m;

# HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name mes.example.com;

    # 健康检查允许 HTTP(供云负载均衡探测)
    location = /healthz {
        proxy_pass http://mes_backend;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mes.example.com;

    # TLS 证书(生产环境请用正式证书)
    ssl_certificate     /etc/nginx/ssl/mes.crt;
    ssl_certificate_key /etc/nginx/ssl/mes.key;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 限流:登录接口更严格
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://mes_backend;
        include /etc/nginx/proxy_params.conf;
    }

    # 通用 API 限流
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mes_backend;
        include /etc/nginx/proxy_params.conf;
    }

    # 机台 TCP 协议不走 Nginx,直连 MES 的 machine_socket_server 端口
    # (需在防火墙单独放行,与办公网隔离)

    # 其余请求
    location / {
        proxy_pass http://mes_backend;
        include /etc/nginx/proxy_params.conf;
    }
}

# 限流区定义(放在 nginx.conf 的 http 块里,这里仅作参考)
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
