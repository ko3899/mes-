server {
    listen 80;
    server_name mes.example.com;  # 修改为你的域名

    # 日志
    access_log /var/log/nginx/mes_access.log;
    error_log /var/log/nginx/mes_error.log;

    # 客户端最大上传大小
    client_max_body_size 50M;

    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS 配置（可选）
server {
    listen 443 ssl http2;
    server_name mes.example.com;

    ssl_certificate /etc/nginx/ssl/mes.crt;
    ssl_certificate_key /etc/nginx/ssl/mes.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 同上配置
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
