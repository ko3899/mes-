version: '3.8'

services:
  mes-factory:
    build: .
    container_name: mes-factory
    ports:
      - "8080:8080"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    environment:
      # 生产环境必须通过 .env 或 shell 注入强随机密钥，例如：
      # SECRET_KEY=<openssl rand -hex 32>
      - MES_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - MES_HOST=0.0.0.0
      - MES_PORT=8080
      - MES_WORKERS=4
      - MES_DB_TYPE=sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
