version: '3.8'

services:
  mes-factory:
    build: .
    container_name: mes-factory
    ports:
      - "8080:8080"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    environment:
      - MES_HOST=0.0.0.0
      - MES_PORT=8080
      - MES_WORKERS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
